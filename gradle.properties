org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

kotlin.code.style=official
ksp.incremental=true

# AGP 9's built-in Kotlin rejects annotation processors that register generated sources through
# the kotlin.sourceSets DSL. KSP (2.2.10-2.0.2, the version AGP 9.4.1 pins) still does, so the
# check is suppressed until KSP switches to the android.sourceSets API.
android.disallowKotlinSourceSets=false
